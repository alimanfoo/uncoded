name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest -v -m "integration or not integration"
        env:
          PYTHONWARNDEFAULTENCODING: "1"

  # This job gives branch protection one check for the whole workflow, so its
  # name stays fixed while the jobs above change. Add every new job to `needs`.
  # The job runs even when a needed job fails. GitHub would otherwise skip it,
  # and GitHub counts a skipped required check as passing.
  required-checks-pass:
    name: Required checks pass
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq --exit-status 'map_values(.result) | ., all(.[]; . == "success")' <<< "$NEEDS"
