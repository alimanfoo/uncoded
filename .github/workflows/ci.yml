name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files

  # The test job runs on every supported operating system, and on every
  # released Python from the requires-python floor up, because the standard
  # library behaves differently between them. setup-uv sets UV_PYTHON, which
  # every later uv command obeys.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      # Fails the job if the environment is not on the matrix interpreter.
      - run: uv run python -c "import os, sys; assert sys.version.startswith(os.environ['UV_PYTHON'] + '.'), sys.version"
        shell: bash
      - run: uv run pytest -v -m "integration or not integration"
        shell: bash
        env:
          PYTHONWARNDEFAULTENCODING: "1"

  # This job gives branch protection one check for the whole workflow, so its
  # name stays fixed while the jobs above change. Add every new job to `needs`.
  # The job runs even when a needed job fails. GitHub would otherwise skip it,
  # and GitHub counts a skipped required check as passing.
  required-checks-pass:
    name: Required checks pass
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq --exit-status 'map_values(.result) | ., all(.[]; . == "success")' <<< "$NEEDS"
