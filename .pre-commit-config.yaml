repos:
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 996abf60411a8d954288ac9856aae7602b80cbda # frozen: v0.22.1
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # frozen: v5.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 82d21874c3242e4dc27bb47641c996902ef64eef # frozen: v0.27
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  # actionlint checks that a workflow is well formed, and zizmor checks that it
  # is secure. zizmor's online audits need a token, so it runs offline.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
        args: [--offline]

  - repo: local
    hooks:
      # Agents emit invisible characters by accident, and no reviewer spots
      # them in a diff. pygrep matches bytes, so the pattern spells out the
      # UTF-8 encoding of U+00A0 NO-BREAK SPACE, U+061C ARABIC LETTER MARK,
      # U+200B to U+200F (the zero-width space, joiners and directional marks),
      # U+202A to U+202E (the directional embeddings and overrides), U+2060
      # WORD JOINER, U+2066 to U+2069 (the directional isolates), and U+FEFF
      # ZERO WIDTH NO-BREAK SPACE.
      - id: forbid-invisible-characters
        name: forbid invisible characters
        entry: '\xc2\xa0|\xd8\x9c|\xe2\x80[\x8b-\x8f\xaa-\xae]|\xe2\x81[\xa0\xa6-\xa9]|\xef\xbb\xbf'
        language: pygrep
        types: [text]
      # Only sync.py writes or removes files or directories, because its
      # functions honour check mode, so uncoded check changes nothing on disk.
      # The pattern matches the pathlib, os and shutil calls that write or
      # remove, and open() in a write mode. It leaves out Path.replace, which
      # it cannot tell apart from str.replace.
      - id: writes-only-in-sync
        name: only sync.py writes or removes files
        entry: '\.(write_text|write_bytes|touch|mkdir|rmdir|unlink|rename|symlink_to|hardlink_to)\(|\bshutil\b|\bos\.(open|remove|unlink|rmdir|removedirs|mkdir|makedirs|rename|renames|replace)\(|\bopen\([^)]*["''][rbt]*[wax+][rwxabt+]*["'']'
        language: pygrep
        types: [python]
        files: ^src/
        exclude: ^src/uncoded/sync\.py$
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix --show-fixes
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: ty
        name: ty
        entry: uv run ty check src tests
        language: system
        pass_filenames: false
      - id: complexipy
        name: complexipy
        entry: uv run complexipy src tests
        language: system
        pass_filenames: false
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
      # The strict documentation build checks the links under docs/, so this
      # hook checks the rest. .remarkrc.json loads the plugin and names the
      # repository, so that a link to a file on GitHub's copy of the repository
      # is checked against the local file.
      - id: remark-validate-links
        name: validate markdown links
        entry: remark --frail --quiet --no-stdout
        language: node
        additional_dependencies:
          - remark-cli@12.0.1
          - remark-validate-links@13.1.0
        files: \.md$
        exclude: ^docs/
      # Runs before uncoded so the generated skill files are built from
      # already-formatted sources. The generated skill dirs are excluded
      # because uncoded sync owns those files.
      - id: prettier
        name: format markdown with prettier
        entry: prettier
        language: node
        additional_dependencies: ["prettier@3.8.1"]
        args: ["--write"]
        files: \.md$
        exclude: ^(CLAUDE\.md|(\.claude|\.agents)/skills/.*)$
      # Regenerates the --help blocks in docs/commands.md, so the commit fails
      # when a block changes. argparse lays out help by the Python version and
      # the terminal width, so the hook runs one version, in an environment of
      # its own, and the blocks set the width.
      - id: cog
        name: generate command help
        entry: uv run --isolated --python 3.13 cog -r -U docs/commands.md
        language: system
        always_run: true
        pass_filenames: false
      - id: mkdocs
        name: build documentation
        entry: uv run mkdocs build
        language: system
        always_run: true
        pass_filenames: false
      - id: uncoded
        name: uncoded
        entry: uv run uncoded sync
        language: system
        always_run: true
        pass_filenames: false
