repos:
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  # actionlint checks that a workflow is well formed, and zizmor checks that it
  # is secure. Its online audits need a token, so it runs offline.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
        args: [--offline]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix --show-fixes
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: ty
        name: ty
        entry: uv run ty check src tests
        language: system
        pass_filenames: false
      - id: complexipy
        name: complexipy
        entry: uv run complexipy src tests
        language: system
        pass_filenames: false
      # Runs before uncoded so the generated skill files are built from
      # already-formatted sources. The generated skill dirs are excluded
      # because uncoded sync owns those files.
      - id: prettier
        name: format markdown with prettier
        entry: prettier
        language: node
        additional_dependencies: ["prettier@3.8.1"]
        args: ["--write"]
        files: \.md$
        exclude: ^(CLAUDE\.md|(\.claude|\.agents)/skills/.*)$
      - id: mkdocs
        name: build documentation
        entry: uv run mkdocs build
        language: system
        always_run: true
        pass_filenames: false
      - id: uncoded
        name: uncoded
        entry: uv run uncoded sync
        language: system
        always_run: true
        pass_filenames: false
