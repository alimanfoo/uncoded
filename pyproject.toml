[build-system]
# Pinned exactly, because the build backend decides what a release ships and
# uv.lock does not cover build requirements.
requires = ["hatchling==1.32.4", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "uncoded"
dynamic = ["version"]
description = "An index of a codebase, and tools to read its code, for AI coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Alistair Miles", email = "alimanfoo@googlemail.com" },
]
dependencies = [
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
]

[dependency-groups]
dev = [
    "cogapp==3.6.0",
    "complexipy==8.1.0",
    "import-linter==2.15",
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.4",
    "ruff==0.17.1",
    "ty>=0.0.93",
]

[project.scripts]
uncoded = "uncoded.cli:main"

[project.urls]
Homepage = "https://alimanfoo.github.io/uncoded/"
Repository = "https://github.com/alimanfoo/uncoded"
Changelog = "https://alimanfoo.github.io/uncoded/changelog/"
Discussions = "https://github.com/alimanfoo/uncoded/discussions"

[tool.hatch.version]
source = "vcs"

# The sdist carries the package alone, beside the files that hatchling reads
# itself, such as README.md and LICENSE. The tests, documentation, specs and
# agent skills stay in the repository, as no downstream packager is supported.
[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.uncoded]
source-roots = ["src", "tests"]
doc-roots = ["README.md", "AGENTS.md", "docs", "src/uncoded"]

[tool.importlinter]
root_package = "uncoded"

[[tool.importlinter.contracts]]
name = "Imports point down the three layers"
type = "layers"
containers = ["uncoded"]
layers = [
    "cli",
    "namespace_map | stubs | docs_map | skill | body | refs",
    "ast_helpers : config : extract : markers : read_helpers : resolver : sync : yaml_tree",
]
exhaustive = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov -m 'not integration'"
filterwarnings = ["error::EncodingWarning"]
markers = ["integration: spawns real ty subprocess (requires uvx)"]
# A misspelled marker would otherwise put a test that spawns ty into the
# default run.
strict = true
# Fails a test that hangs, such as one waiting on ty, and prints the stack of
# every thread. CI raises the limit on macOS and Windows, which run slower.
timeout = 30

[tool.coverage.run]
source = ["src"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ruff]
line-length = 88
extend-exclude = [".uncoded"]

[tool.ruff.lint]
preview = true
select = [
    "D", # pydocstyle (pep257)
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "complex-structure", # mccabe complexity
    "W", # pycodestyle warnings
    "C4", # flake8-comprehensions
    "PIE", # flake8-pie (misc. lints)
    "PGH", # pygrep-hooks
    "FLY", # flynt (f-string conversion)
    "PERF", # perflint (performance anti-patterns)
    "RUF", # Ruff-specific rules
    "PLE", # Pylint errors
    "unspecified-encoding", # Pylint: unspecified-encoding
    "redefined-loop-name", # Pylint: redefined loop variable
    "import-outside-top-level", # Pylint: import not at top of file
    "TC", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "collapsible-else-if", # Pylint: elif after return
    "useless-return", # Pylint: useless return
    "repeated-equality-comparison", # Pylint: repeated equality comparison
    "too-many-return-statements", # Pylint: too many return statements
    "too-many-branches", # Pylint: too many branches
    "too-many-arguments", # Pylint: too many arguments
    "too-many-statements", # Pylint: too many statements
    "too-many-positional-arguments", # Pylint: too many positional arguments
    "too-many-nested-blocks", # Pylint: too many nested blocks (preview)
    "ANN", # flake8-annotations
    "S", # flake8-bandit (security)
    "PT", # flake8-pytest-style
    "N", # pep8-naming
]

ignore = [
    "any-type", # Any as annotation type (too broad to enforce)
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-positional-args = 0

[tool.complexipy]
max-complexity-allowed = 15

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "assert"]
# refs.py is the one module that spawns a subprocess, to run the ty language
# server. Its command is a fixed list, and it finds uvx on PATH by design.
"src/uncoded/refs.py" = [
    "suspicious-subprocess-import",
    "subprocess-without-shell-equals-true",
    "start-process-with-partial-path",
]
# The tests of refs.py build mocks of, and stand-ins for, the subprocess that it
# spawns.
"tests/{conftest,test_refs}.py" = [
    "suspicious-subprocess-import",
]
